# Blueprint do Render: New > Blueprint apontando para este repositório cria os
# dois serviços de uma vez.
#
# São DOIS processos de verdade, não um só com redundância. A API aceita e
# agenda campanhas; quem envia mensagem é o worker. Só a API no ar significa
# campanha criada e nada saindo — sem nenhum erro visível na tela.
#
# `type: worker` não existe no plano gratuito do Render. Se o worker recusar a
# criação, é isso: o plano precisa ser pago.

envVarGroups:
  # Credenciais que API e worker compartilham, preenchidas uma vez só no painel.
  # `sync: false` é justamente o que mantém o valor fora do Git: o Render cria a
  # chave vazia e espera você colar o segredo lá.
  - name: disparoy-segredos
    envVars:
      - key: SUPABASE_URL
        sync: false
      # Ignora RLS. Só API e worker podem tê-la — nunca o navegador.
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      # Assina os tokens de login. Trocar derruba todas as sessões abertas.
      # Gere com: openssl rand -hex 32
      - key: JWT_SECRET
        sync: false
      # SESSION pooler, porta 5432. O TRANSACTION pooler (6543) não serve: o
      # pg-boss usa LISTEN/NOTIFY e advisory locks, que ele não repassa.
      - key: DATABASE_URL
        sync: false
      - key: EVOLUTION_API_URL
        sync: false
      - key: EVOLUTION_API_KEY
        sync: false
      # Valida POST /api/webhooks/evolution, que é público por natureza.
      # Gere com: openssl rand -hex 32
      - key: EVOLUTION_WEBHOOK_SECRET
        sync: false
      # Tecnicamente opcional, na prática o que separa "o worker caiu às 3h e
      # alguém soube" de "o cliente descobriu pelo silêncio, no dia seguinte".
      #
      # Webhook de entrada do Slack/Discord/Teams (ou endpoint próprio) que
      # recebe um POST a cada 500 da API, crash do worker e — o que mais
      # importa — quando o vigia detecta o worker sem bater pulso há 3 min.
      #
      # Sem isto o sistema NÃO finge ter alertado: a API registra a ausência em
      # nível de erro no boot, e o incidente fica gravado com
      # `alerta_estado = 'desabilitado'` (ver 20260822000600). O aviso existe;
      # o que não existe é alguém para recebê-lo.
      #
      # O VALOR É SEGREDO: numa URL de webhook do Slack/Discord o token está no
      # caminho. Nunca vai para log — a API troca o endereço por um marcador.
      - key: ALERTA_WEBHOOK_URL
        sync: false

services:
  - type: web
    name: disparoy-api
    runtime: node
    plan: starter
    region: oregon
    branch: main
    # `--include=dev` é obrigatório: o Render define NODE_ENV=production, e sem
    # as devDependencies não existem nest CLI nem tsc para o build rodar.
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm run start:api
    # Rota @Publico(), leve e sem sessão — verifica o banco de passagem.
    healthCheckPath: /api/saude
    # DUAS réplicas — só passou a ser seguro depois que `evolution-provider.ts`
    # deixou de guardar a agenda em memória por 5 minutos (era a ÚNICA coisa
    # neste backend que vivia fora do Postgres). Com o cache, réplica A podia
    # reparear um canal com outro número e a réplica B seguir entregando a
    # agenda do número anterior — dado pessoal de quem não tinha mais nada a
    # ver com aquele canal. Hoje `contatosDaInstancia` só deduplica chamada
    # concorrente DENTRO do mesmo processo; nada sobrevive entre requisições,
    # em nenhuma réplica. Se `numInstances` voltar a subir mais, confira que
    # nada novo em `evolution-provider.ts`/`canais.service.ts` reintroduziu
    # estado de processo antes de continuar escalando.
    numInstances: 2
    envVars:
      - fromGroup: disparoy-segredos
      - key: NODE_ENV
        value: production
      # Domínio do painel na Vercel, ex.: https://disparoy.vercel.app
      # Sem isto o CORS barra o front inteiro. Aceita vários, separados por vírgula.
      # `*` cobre UM rótulo do host, para as URLs que a Vercel troca a cada
      # deploy: https://disparoy.vercel.app,https://disparoy-frontend-*.vercel.app
      - key: ORIGENS_PERMITIDAS
        sync: false
      # URL pública DESTA API, ex.: https://disparoy-api.onrender.com
      # É o que a Evolution registra para entregar os webhooks de status.
      - key: APP_URL_PUBLICA
        sync: false
      # Não há auto-cadastro: este admin nasce no boot e cria os demais acessos.
      # Preenchidos juntos, ou a API recusa subir. Criado uma vez só.
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_SENHA
        sync: false
      - key: ADMIN_NOME
        sync: false
      # Opcional: só o botão "Gerar variações". Sem a chave ele responde 503.
      - key: GROQ_API_KEY
        sync: false

  - type: worker
    name: disparoy-worker
    runtime: node
    plan: starter
    region: oregon
    branch: main
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm run start:worker
    envVars:
      - fromGroup: disparoy-segredos
      - key: NODE_ENV
        value: production
      # Mesma URL da API (ex.: https://disparoy-api.onrender.com), não um
      # endereço do worker — ele não escuta porta nenhuma.
      #
      # Faltava aqui, e o worker não subia UMA vez sequer em produção:
      # `ambiente()` exige esta chave quando NODE_ENV=production, e a exigência
      # vale para QUALQUER processo que valide o ambiente, não só para a API.
      # O boot morria em `new SupabaseService`, antes da fila — nenhuma campanha
      # saía, nenhum pulso era batido, e o único sinal era o incidente que o
      # vigia abria do outro lado. O worker também precisa dela de fato: ao
      # reconectar um canal, `registrarWebhook` monta a URL de callback com ela.
      - key: APP_URL_PUBLICA
        sync: false
      # Envios simultâneos por canal. Subir demais é convite a bloqueio.
      - key: DISPARO_CONCORRENCIA_POR_CANAL
        value: "1"
      # Quanto tempo depois da hora marcada uma campanha agendada ainda pode
      # começar. Passado isso ela vira `falhou` e NADA é enviado.
      #
      # 30 min é o que atravessa um deploy ruim (o Render reinicia o worker a
      # cada publicação) sem matar campanha nenhuma. Antes disto não havia teto:
      # o worker voltava do reinício, a fila entregava o job com o `startAfter`
      # já vencido, e a campanha saía horas atrasada — "promoção só hoje"
      # chegando de madrugada no dia seguinte.
      #
      # Piso de 5, que é a carência de `reivindicar_agendamentos_vencidos`:
      # abaixo disso a campanha expira antes de ganhar a segunda tentativa de
      # ser reenfileirada.
      - key: AGENDAMENTO_TOLERANCIA_MINUTOS
        value: "30"
